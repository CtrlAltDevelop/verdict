name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Stable, not the declared 3.0.0 floor: the dev dependencies (lints,
          # test) need a newer SDK than the package itself does, so the floor
          # cannot install a test runner. The floor is enforced by the
          # analyzer instead — it resolves the code at language version 3.0.
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/verdict_example.dart
      - run: dart pub publish --dry-run

name: verdict
description: >-
  A sealed Result type and a structured Failure hierarchy for Dart, so calls
  return a typed verdict instead of throwing across layer boundaries.
version: 1.2.0
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/verdict
issue_tracker: https://github.com/CtrlAltDevelop/verdict/issues

topics:
  - result
  - either
  - error-handling
  - functional
  - sealed

# No `flutter:` constraint on purpose: the package is pure Dart, and declaring
# one would make the Flutter SDK mandatory for server and CLI consumers.
# The floor is Dart 3.12, the SDK every package here is gated on. The code
# needs only Dart 3.0 — sealed classes, `final class` and pattern matching —
# so the bound is a house rule rather than a requirement of the source.
environment:
  sdk: ^3.12.0

# Dependency bounds are ranges rather than carets on the lower end, so a
# consumer already on an older 3.x of equatable is not forced to move.
dependencies:
  equatable: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ">=6.0.0 <7.0.0"
  test: ">=1.31.0 <2.0.0"
